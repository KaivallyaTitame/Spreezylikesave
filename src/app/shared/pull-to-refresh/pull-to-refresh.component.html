<div class="pull-refresh-container">
    <div class="pull-refresh-indicator fixed top-0 left-0 right-0 flex justify-center items-center z-50" [ngClass]="{
        'visible': isPulling || isRefreshing,
        'refreshing': isRefreshing
      }" [ngStyle]="{
        'transform': 'translateY(' + (isPulling ? (pullDistance - 60 > 20 ? pullDistance - 60 : 20) : (isRefreshing ? '20px' : '-60px')) + ')'
      }">

        <div class="instagram-spinner-container">
            <div class="instagram-spinner" [ngClass]="{
            'visible': isPulling && pullDistance > 30,
            'spinning': isRefreshing,
            'ready': isPulling && pullDistance >= refreshThreshold
          }">
                <div class="spinner-ring outer-ring"></div>
                <div class="spinner-ring inner-ring"></div>
                <div class="spinner-center"></div>
            </div>
        </div>
    </div>

    <div class="content-wrapper transition-transform duration-300 ease-out" [ngStyle]="{
        'transform': 'translateY(' + (isPulling ? (pullDistance * 0.6 > 80 ? pullDistance * 0.6 : 80) : 0) + 'px)',
        'transition': isPulling ? 'none' : 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)'
      }" #contentWrapper (touchstart)="onTouchStart($event)" (touchmove)="onTouchMove($event)"
        (touchend)="onTouchEnd($event)">

        <ng-content></ng-content>

        <div *ngIf="isLoadingMore && hasMoreData" class="load-more-indicator flex justify-center items-center py-4">
            <div class="flex items-center space-x-2">
                <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-gray-500"></div>
                <span class="text-gray-500 text-sm">Loading more...</span>
            </div>
        </div>

        <div *ngIf="!hasMoreData && !isLoadingMore" class="no-more-data flex justify-center items-center py-4">
            <span class="text-gray-400 text-sm">No more content to load</span>
        </div>
    </div>
</div>
