<div class="pull-refresh-container">
  <div
    class="pull-refresh-indicator fixed top-0 left-0 right-0 flex justify-center items-center z-50"
    [ngClass]="{
      visible: isPulling || isRefreshing,
      refreshing: isRefreshing
    }"
    [ngStyle]="{
      transform:
        'translateY(' +
        (isPulling
          ? pullDistance - 60 > 20
            ? pullDistance - 60
            : 20
          : isRefreshing
          ? '20px'
          : '-60px') +
        ')'
    }"
  >
    <div class="custom-loader-container" *ngIf="isPulling || isRefreshing">
      <svg
        class="custom-loader-svg animate-spin"
        xmlns="http://www.w3.org/2000/svg"
        width="48"
        height="48"
        viewBox="0 0 48 48"
      >
        <defs>
          <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ED6A5A" />
            <stop offset="100%" stop-color="#C4453E" />
          </linearGradient>
        </defs>
        <!-- Background circle with gradient -->
        <circle cx="24" cy="24" r="22" fill="url(#bgGradient)" />

        <!-- Arc path -->
        <path
          d="M24 12a12 12 0 1 1-8.49 3.51"
          fill="none"
          stroke="#fff"
          stroke-width="3"
          stroke-linecap="round"
        />

        <!-- Bigger arrowhead -->
        <polygon points="15,10 23,15 18,22" fill="#fff" />
      </svg>
    </div>
  </div>

  <div
    class="content-wrapper transition-transform duration-300 ease-out"
    [ngStyle]="{
      transform:
        'translateY(' +
        (isPulling ? (pullDistance * 0.6 > 80 ? pullDistance * 0.6 : 80) : 0) +
        'px)',
      transition: isPulling
        ? 'none'
        : 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)'
    }"
    #contentWrapper
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd($event)"
  >
    <ng-content></ng-content>

    <div
      *ngIf="isLoadingMore && hasMoreData"
      class="load-more-indicator flex justify-center items-center py-4"
    >
      <div class="flex items-center space-x-2">
        <div
          class="animate-spin rounded-full h-5 w-5 border-b-2 border-gray-500"
        ></div>
        <span class="text-gray-500 text-sm">Loading more...</span>
      </div>
    </div>

    <div
      *ngIf="!hasMoreData && !isLoadingMore"
      class="no-more-data flex justify-center items-center py-4"
    >
      <span class="text-gray-400 text-sm">No more content to load</span>
    </div>
  </div>
</div>
