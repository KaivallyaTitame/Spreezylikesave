<div class="relative">
  <div class="fixed top-0 w-full z-30 flex box-border h-auto">
    <div class="navbar py-1 bg-primarycolor-0 shadow-none">
      <div class="navbar-start flex items-center">
        <input type="checkbox" id="drawer-left" #drawerLeft class="drawer-toggle hidden" />
        <label for="drawer-left" class="btn w-9 bg-primarycolor-0 flex items-center justify-center" style="height: 7.3%;">
          <fa-icon class="text-white text-2xl" [icon]="faIcons.bars"></fa-icon>
        </label>

        <label for="drawer-left" class="overlay fixed top-0 left-0 w-full h-full bg-black opacity-50 z-20 hidden"></label>
  
        <div class="drawer fixed top-0 left-0 w-4/5 h-full border-r-2 z-40 bg-white" style="margin-top: 56px;">
          <div class="drawer-content pt-2 px-2 mt-1 overflow-y-auto" style="height: 87%;">
            <aside class="sidebar h-full flex flex-col bg-white">
             
              <section class="sidebar-title p-2 text-center">
                <div class="flex flex-col w-full">
                  <div class="avatar h-14 w-14 mx-auto">
                    <img *ngIf="business" [src]="business.profilePicture" alt="avatar" class="rounded-full" />
                  </div>
                  <span class="text-xl mt-2 font-sidebar text-primary">{{ business?.name }}</span>
                  <span class="text-lg font-normal font-sidebar text-content2">{{ business?.username }}</span>
                </div>
              </section>

              <div class="divider my-2"></div>

              <section class="sidebar-content flex-grow overflow-visible pt-1">
                <nav class="menu rounded-md">
                  <section class="menu-section px-2">
                    <ul class="menu-items">
                      <li class="menu-item py-1 flex items-center">
                        <fa-icon class="pl-0 pr-1 text-lg w-8 h-8 text-primarycolor-0" [icon]="faIcons.filePen"></fa-icon>
                        <span class="pl-1 text-lg font-normal text-black dark:text-black">Share Feedback</span>
                      </li>
                      <li class="menu-item py-1 flex items-center" [routerLink]="['/consumer-home/settings']">
                        <fa-icon class="pl-0 pr-1 text-lg w-8 h-8 text-primarycolor-0" [icon]="faIcons.gear"></fa-icon>
                        <span class="pl-1 text-lg font-normal text-black dark:text-black">
                          Settings
                        </span>
                      </li>
                      <li class="menu-item py-1 flex items-center">
                        <img src="assets/logo.png" alt="Contact Us" class="pl-0 pr-1 w-8 h-8" />
                        <span class="pl-1 text-lg font-normal text-black dark:text-black">Contact Us</span>
                      </li>
                      <li class="menu-item py-1 flex items-center">
                        <fa-icon class="pl-0 pr-1 text-lg w-8 h-8 text-primarycolor-0" [icon]="faIcons.circleQuestion"></fa-icon>
                        <span class="pl-1 text-lg font-normal text-black dark:text-black">Help</span>
                      </li>
                      <li class="menu-item py-1 flex items-center">
                        <fa-icon class="pl-0 pr-1 text-lg w-8 h-8 text-primarycolor-0" [icon]="faIcons.fileLines"></fa-icon>
                        <span class="pl-1 text-lg font-normal text-black dark:text-black">Terms & Conditions</span>
                      </li>
                    </ul>
                  </section>
                </nav>
              </section>

              <div class="divider my-2"></div>

              <section class="sidebar-footer">
                <ul class="menu-items">
                  <li class="menu-item py-1">
                    <fa-icon class="pl-1 pr-1 text-lg w-8 h-8 text-primarycolor-0" [icon]="faArrowRightFromBracket"></fa-icon>
                    <span class="pl-1 text-lg font-normal" (click)="logout()">Logout</span>
                  </li>
                </ul>
              </section>
            </aside>
          </div>
        </div>

        <a class="navbar-item ml-0 pl-1 font-medium text-2xl text-white font-primary">Spreezy</a>
      </div>
    </div>
  </div>
  <div class="bottom-component z-10"></div>
</div>
