
<div class="bg-white p-6">
  <form class="max-w-2xl mx-auto" [formGroup]="form" (ngSubmit)="registerUser()">
    <div class="space-y-6">
      <h2 class="text-2xl font-bold text-center mb-6">Upload Documents</h2>

      <!-- Aadhar Card Upload -->
      <div class="space-y-4">
        <label class="block text-xl font-medium text-center">Aadhar Card Photo</label>
        <div 
          (click)="triggerFileInput('aadharCardPhoto')"
          class="border-2 border-dashed rounded-lg p-4 hover:border-blue-500 cursor-pointer transition-colors"
        >
          <div *ngIf="!aadharPreview" class="h-48 flex flex-col items-center justify-center text-gray-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <span>Click to upload Aadhar Card</span>
          </div>
          <img 
            *ngIf="aadharPreview" 
            [src]="aadharPreview" 
            alt="Aadhar Preview" 
            class="w-full h-48 object-contain"
          >
        </div>
        <input
          type="file"
          id="aadharCardPhoto"
          accept="image/*"
          class="hidden"
          (change)="handleFileUpload($event, 'aadharCardPhoto')"
        >
        <div class="text-red-600 text-sm" *ngIf="!aadharCardPhoto && aadharCardPhotoControl?.touched">
          Aadhar Card Photo is required
        </div>
      </div>

      <!-- PAN Card Upload -->
      <div class="space-y-4">
        <label class="block text-xl font-medium text-center">PAN Card Photo</label>
        <div 
          (click)="triggerFileInput('panCardPhoto')"
          class="border-2 border-dashed rounded-lg p-4 hover:border-blue-500 cursor-pointer transition-colors"
        >
          <div *ngIf="!panPreview" class="h-48 flex flex-col items-center justify-center text-gray-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <span>Click to upload PAN Card</span>
          </div>
          <img 
            *ngIf="panPreview" 
            [src]="panPreview" 
            alt="PAN Preview" 
            class="w-full h-48 object-contain"
          >
        </div>
        <input
          type="file"
          id="panCardPhoto"
          accept="image/*"
          class="hidden"
          (change)="handleFileUpload($event, 'panCardPhoto')"
        >
        <div class="text-red-600 text-sm" *ngIf="!panCardPhoto && panCardPhotoControl?.touched">
          PAN Card Photo is required
        </div>
      </div>

      <!-- Terms & Conditions -->
      <div class="flex items-center gap-2">
        <input 
          type="checkbox" 
          class="checkbox-primary checkbox" 
          formControlName="confirmPolicies"
        >
        <label class="text-sm">
          I accept the <a href="https://example.com/terms" target="_blank" class="text-blue-600 hover:underline">Terms & Conditions</a>
        </label>
      </div>
      <div class="text-red-600 text-sm" *ngIf="confirmPolicies.invalid && (confirmPolicies.dirty || confirmPolicies.touched)">
        You must accept the terms and conditions
      </div>

      <!-- Submit Button -->
      <div class="flex justify-center items-center ">
        <button
          type="submit"
          [disabled]="form.invalid || isSubmitting"
          class="btn btn-primary btn-md font-secondary w-30"
        >
          {{ isSubmitting ? 'Processing...' : 'Submit Documents' }}
        </button>
      </div>
    </div>
  </form>

  <!-- Popup -->
  <div *ngIf="showPopUp" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
    <div class="bg-white rounded-lg shadow-lg p-5 w-90">
      <h2 class="text-xl font-semibold text-center text-gray-800">{{ popupMessageTitle }}</h2>
      <p class="mt-4 text-center text-gray-600">{{ popupMessageBody }}</p>
      <div class="flex justify-center mt-6">
        <button class="btn btn-primary" (click)="handleClosePopUp()">OK</button>
      </div>
    </div>
  </div>
</div>
