<app-category-selector></app-category-selector>
<form [formGroup]="postFormDetails" (ngSubmit)="handleSubmit()">

  <div class="title font-roboto text-black text-base" style="margin-top: 15px; margin-left: 15px;">
    <label for="postTitle">Title *</label>
  </div>
  <div class="input-container" style="margin-left: 15px;">
    <input formControlName="postTitle" type="text" class="title-input border border-pink-500 rounded-md p-2" placeholder="Add Title Here..." id="postTitle">
    <div *ngIf="postFormDetails.get('postTitle')?.touched && postFormDetails.get('postTitle')?.invalid" class="text-red-500">Title is required.</div>
  </div>

  <app-image-selector></app-image-selector>
  
  <div class="title font-roboto text-black text-base" style="margin-top: 15px; margin-left: 15px;">
    <label for="description">Offer Details *</label>
  </div>
  <div class="input-container" style="margin-left: 15px;">
    <textarea formControlName="description" class="offer-details-input border border-pink-500 rounded-md p-2" placeholder="Describe more about the offer you want to share with your customer." id="description"></textarea>
    <div *ngIf="postFormDetails.get('description')?.touched && postFormDetails.get('description')?.invalid" class="text-red-500">Offer details are required.</div>
  </div>

  <div class="title font-roboto text-black text-base" style="margin-top: 15px; margin-left: 15px;">
    <label for="expiry">Offer Expiry Date *</label>
  </div>
  <div class="input-container" style="margin-left: 15px;">
    <input formControlName="expiry" type="datetime-local" class="date-input border border-pink-500 rounded-md p-2" id="expiry">
    <div *ngIf="postFormDetails.get('expiry')?.touched && postFormDetails.get('expiry')?.invalid" class="text-red-500">Expiry date is required.</div>
  </div>

  <div class="title font-roboto text-black text-base" style="margin-top: 15px; margin-left: 15px;">
    <label for="promoBadge">Offer Badge *</label>
  </div>
  <div class="input-container" style="margin-left: 15px;">
    <input formControlName="promoBadge" type="text" class="badge-input border border-pink-500 rounded-md p-2" placeholder="Eg: Upto 30% Off" id="promoBadge">
    <div *ngIf="postFormDetails.get('promoBadge')?.touched && postFormDetails.get('promoBadge')?.invalid" class="text-red-500">Offer badge is required.</div>
  </div>

  <div class="title font-roboto text-black text-base" style="margin-top: 15px; margin-left: 15px;">
    <label for="termsAndConditions">Terms & Conditions *</label>
  </div>
  <div class="input-container" style="margin-left: 15px;">
    <textarea formControlName="termsAndConditions" class="terms-input border border-pink-500 rounded-md p-2" placeholder="Enter terms and conditions" id="termsAndConditions" #termsTextarea (keydown)="addBulletPointOnEnter($event, termsTextarea)" (focus)="addBulletPointOnFocus(termsTextarea)" ></textarea>
    <div *ngIf="postFormDetails.get('termsAndConditions')?.touched && postFormDetails.get('termsAndConditions')?.invalid" class="text-red-500">Terms and conditions are required.</div>
  </div>

  <div class="title font-roboto text-black text-base" style="margin-top: 15px; margin-left: 15px;">
    <label for="stepsToAvailOffer">How to Redeem *</label>
  </div>
  <div class="input-container" style="margin-left: 15px;">
    <textarea formControlName="stepsToAvailOffer" class="how-to-redeem-input border border-pink-500 rounded-md p-2" placeholder="Provide instructions on how to redeem the coupon code." id="stepsToAvailOffer" #howToRedeemTextarea (keydown)="addBulletPointOnEnter($event, howToRedeemTextarea)" (focus)="addBulletPointOnFocus(howToRedeemTextarea)" ></textarea>
    <div *ngIf="postFormDetails.get('stepsToAvailOffer')?.touched && postFormDetails.get('stepsToAvailOffer')?.invalid" class="text-red-500">Redemption instructions are required.</div>
  </div>

  <div class="buttons-container" style="margin-left: 39px; margin-top: 15px;">
    <button type="button" class="reset-button" (click)="postFormDetails.reset()">RESET DETAILS</button>
    <button type="submit" class="post-button">POST</button>
  </div>
</form>
