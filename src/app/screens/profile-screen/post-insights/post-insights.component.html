<div *ngIf="showInsightScreen" [ngClass]="showInsightScreen ? 'backdrop-blur-snow' : 'backdrop-blur'"></div>

<div #childDiv class="slide-up fixed w-full z-30 mb-0"
    [ngClass]="{
      'slide-up-active': showInsightScreen,
      'slide-up-hidden': !showInsightScreen
    }">
    <div class="grid grid-cols-3 md:grid-cols-4 gap-5 justify-items-center">
        <div  class="flex flex-col items-center mb-4">
          <fa-icon [icon]="faHeart" class="fa-2x text-[#ed6a5a]"></fa-icon>
          <p class="text-textcolor-0">Likes</p>
          <p class="text-textcolor-0">{{feed['likes']}}</p>
        </div>

        <div  class="flex flex-col items-center mb-4">
          <fa-icon [icon]="faThumbsDown" class="fa-2x text-[#ed6a5a]"></fa-icon>
          <p class="text-textcolor-0">Dislikes</p>
          <p class="text-textcolor-0">{{feed['dislikes']}}</p>
        </div>

        <div  class="flex flex-col items-center mb-4">
          <fa-icon [icon]="faLocationArrow" class="fa-2x text-[#ed6a5a]"></fa-icon>
          <p class="text-textcolor-0">Shares</p>
          <p class="text-textcolor-0">{{feed['shares']}}</p>
        </div>

        <div  class="flex flex-col items-center mb-4">
          <fa-icon [icon]="faBookmark" class="fa-2x text-[#ed6a5a]"></fa-icon>
          <p class="text-textcolor-0">Saves</p>
          <p class="text-textcolor-0">{{feed['saves']}}</p>
        </div>

        <div class="flex flex-col items-center mb-4">
          <fa-icon [icon]="faUsers" class="fa-2x text-[#ed6a5a]"></fa-icon>
          <p class="text-textcolor-0">Engagement</p>
          <p class="text-textcolor-0">{{feed['engagementCount']}}</p>
        </div>

        <!-- To be enable when we enable reach count from backend -->
        <!-- <div class="flex flex-col items-center mb-4">
          <fa-icon [icon]="faHandshake" class="fa-2x text-[#ed6a5a]"></fa-icon>
          <p class="text-textcolor-0">Reach</p>
          <p class="text-textcolor-0">{{feed['reach']}}</p>
        </div> -->
    </div>
</div>
