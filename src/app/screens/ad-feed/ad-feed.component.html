<div class="ad-feed mt-12" class="feed-container overflow-auto" (touchstart)="onTouchStart($event)"
(touchmove)="onTouchMove($event)"
(touchend)="onTouchEnd($event)"
#feedContainer >
  <div class="refresh-indicator" [style.transform]="indicatorTransform" [class.active]="isRefreshing">
    <p *ngIf="!isRefreshing">Pull to refresh</p>
    <p *ngIf="isRefreshing">Refreshing...</p>
  </div>
  <div class="feed mt-12 mb-12" #feed>
    <ng-container *ngIf="isLoading; else content">
      <app-skeleton *ngFor="let i of [1, 2, 3, 4, 5]"></app-skeleton>
    </ng-container>

    <ng-template #content>
      <div *ngFor="let ad of ads" class="ad-item">
        <ng-container *ngIf="ad.advertisementType == 'Post'">
          <div [ngClass]="{'opacity-50 pointer-events-none': isExpired(ad.offerExpiry)}">
            <app-Post [postDetails]="ad"></app-Post>
          </div>
        </ng-container>

        <ng-container *ngIf="ad.advertisementType == 'Event'">
          <div [ngClass]="{'opacity-50 pointer-events-none': isExpired(ad.offerExpiry)}">
            <app-Event [eventDetails]="ad"></app-Event>
          </div>
        </ng-container>
        <ng-container *ngIf="ad.advertisementType == 'Coupon'">
          <div [ngClass]="{'opacity-50 pointer-events-none': isExpired(ad.offerExpiry)}">
            <app-Coupon [couponDetails]="ad"></app-Coupon>
          </div>
        </ng-container>
      </div>
    </ng-template>
  </div>
</div>

<!-- Optional: Error Popup -->
<app-pop-up *ngIf="showErrorPopup" [messageTitle]="'Error'" [messageBody]="errorMessage"
  (close)="showErrorPopup = false"></app-pop-up>
