<div class="ad-feed mt-12">
  <div class="ad-feed mt-12 mb-12">
    <ng-container *ngIf="isLoading; else content">
      <!-- Show skeleton loaders while loading -->
      <app-skeleton *ngFor="let i of [1, 2, 3, 4, 5]"></app-skeleton> <!-- Adjust the number of skeletons based on expected ad count -->
    </ng-container>

    <ng-template #content>
      <div *ngFor="let ad of ads" class="ad-item">
        <ng-container *ngIf="ad.advertisementType == 'Post'">
          <div [ngClass]="{'opacity-50 pointer-events-none': isExpired(ad.offerExpiry)}">
            <app-Post [postDetails]="ad"></app-Post>
          </div>
        </ng-container>

        <ng-container *ngIf="ad.advertisementType == 'Event'">
          <div [ngClass]="{'opacity-50 pointer-events-none': isExpired(ad.offerExpiry)}">
            <app-Event [eventDetails]="ad"></app-Event>
          </div>
        </ng-container>
        <ng-container *ngIf="ad.advertisementType == 'Coupon'">
          <div [ngClass]="{'opacity-50 pointer-events-none': isExpired(ad.offerExpiry)}">
            <app-Coupon [couponDetails]="ad"></app-Coupon>
          </div>
        </ng-container>
      </div>
    </ng-template>
  </div>
</div>

<!-- Optional: Error Popup -->
<app-pop-up *ngIf="showErrorPopup" [messageTitle]="'Error'" [messageBody]="errorMessage" (close)="showErrorPopup = false"></app-pop-up>
